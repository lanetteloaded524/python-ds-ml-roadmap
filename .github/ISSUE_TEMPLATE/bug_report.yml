name: "🐛 Bug Report"
description: "Report an error in a notebook or project"
labels: ["bug"]
body:
  - type: input
    id: file
    attributes:
      label: "Notebook/File"
      description: "Which file has the issue?"
      placeholder: "e.g., projects/02_ml_fundamentals/ml_fundamentals.ipynb"
    validations:
      required: true
  - type: input
    id: cell
    attributes:
      label: "Cell Number (if applicable)"
      placeholder: "e.g., Cell 15"
  - type: textarea
    id: error
    attributes:
      label: "Error Message"
      description: "Paste the full error traceback"
      render: python
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: "Python Version"
      placeholder: "e.g., 3.12.0"
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - Windows
        - macOS
        - Linux
        - Google Colab
