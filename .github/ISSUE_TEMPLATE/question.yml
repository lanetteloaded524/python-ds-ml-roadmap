name: "❓ Question"
description: "Ask a question about the content"
labels: ["question"]
body:
  - type: input
    id: section
    attributes:
      label: "Which notebook/section?"
      placeholder: "e.g., Deep Learning notebook, CNN section"
  - type: textarea
    id: question
    attributes:
      label: "Your Question"
      description: "What would you like to know?"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Any code, screenshots, or context that helps"
