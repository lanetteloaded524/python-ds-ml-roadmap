name: Validate Notebooks & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install nbconvert ipykernel
          python -m ipykernel install --user --name python3
      
      - name: Validate notebooks execute
        run: |
          failed=0
          for nb in projects/*/[!.]*.ipynb; do
            echo "::group::Validating $nb"
            if jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=300 \
              --ExecutePreprocessor.kernel_name=python3 \
              --output-dir /tmp --output validated "$nb" 2>&1; then
              echo "✅ $nb passed"
            else
              echo "❌ $nb failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ $failed -eq 1 ]; then exit 1; fi
      
      - name: Run MLOps tests
        run: |
          cd projects/06_mlops_deployment
          python train.py
          pytest tests/ -v

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'
        continue-on-error: true
